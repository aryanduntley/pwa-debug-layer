# Publish @aryanduntley/pwa-debug to npm when a vX.Y.Z tag is pushed.
#
# Pattern mirrors py-trkpac's python-publish.yml: tag-triggered, a build job that
# uploads the packed artifact, and a separate publish job gated behind a GitHub
# `release` environment with OIDC. Adapted PyPI -> npm (this is a Node project;
# there is no Python here, so npm is the registry — see docs/discoverability.md).
#
# Cut a release:  node scripts/bump-version.mjs  (sync versions)  then  gitpush.sh  (commit + tag + push)
#
# Prerequisites:
#   1. packages/host/package.json "private": false (currently true as a guard).
#   2. A trusted publisher configured on npmjs.com for @aryanduntley/pwa-debug:
#      GitHub Actions, repo aryanduntley/pwa-debug-layer, workflow "publish.yml",
#      environment "release". With OIDC there is NO long-lived NPM_TOKEN to rotate.
#   3. A GitHub Environment named "release" (optionally with required reviewers).
#      Must match the environment named in the npm trusted-publisher config.

name: Publish to npm

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: latest
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (shared → extension → host bundle)
        run: pnpm -r build

      - name: Test
        run: pnpm -r test

      - name: Guard — refuse to publish a private package
        run: |
          if [ "$(node -p "require('./packages/host/package.json').private === true")" = "true" ]; then
            echo "::error::packages/host is still \"private\": true — set it to false to publish."
            exit 1
          fi

      - name: Pack the @aryanduntley/pwa-debug tarball
        run: pnpm --filter @aryanduntley/pwa-debug pack --pack-destination "${{ runner.temp }}/dist"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: ${{ runner.temp }}/dist/*.tgz

  npm-publish:
    runs-on: ubuntu-latest
    needs: release-build
    permissions:
      contents: read
      id-token: write # npm provenance / supply-chain attestation
    environment:
      name: release
      url: https://www.npmjs.com/package/@aryanduntley/pwa-debug
    steps:
      - name: Retrieve release artifact
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - uses: actions/setup-node@v4
        with:
          node-version: latest
          registry-url: https://registry.npmjs.org

      # Trusted publishing: npm (>= 11.5.1, bundled with current Node) exchanges
      # the GitHub OIDC id-token for a short-lived publish credential — no
      # NODE_AUTH_TOKEN. Provenance is attested automatically from the OIDC claims.
      # The leading ./ is required — without it npm parses "dist/<file>.tgz" as a
      # GitHub repo shorthand and tries to git-clone it.
      - name: Publish to npm (OIDC trusted publisher)
        run: npm publish ./dist/*.tgz --access public --provenance
